events {}

http {
    upstream user_service {
        server user-service:8001;
    }

    upstream project_service {
        server project-service:8002;
    }

    upstream application_service {
        server application-service:8003;
    }

    upstream work_review_service {
        server work-review-service:8004;
    }

    upstream payment_notification_service {
        server payment-notification-service:8005;
    }

    # Applied to every proxied location below. Method, body, query string
    # and the Authorization header are passed through unchanged.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    client_max_body_size 5m;

    server {
        listen 80;

        # Gateway-generated failures (service down / timed out) use the
        # common error envelope instead of nginx HTML pages.
        error_page 502 503 504 = @upstream_error;

        # Treat collection roots without the trailing slash (/api/projects)
        # as the canonical form, for every method, instead of redirecting.
        rewrite ^(/api/[a-z]+)$ $1/ last;
        absolute_redirect off;

        location @upstream_error {
            default_type application/json;
            return 503 '{"error":"An upstream service is unavailable.","code":"UPSTREAM_SERVICE_ERROR","details":{}}';
        }

        # Useful for local testing.
        location = / {
            default_type application/json;
            return 200 '{"data":{"service":"ctc-api-gateway","status":"running"},"message":"Gateway is running"}';
        }

        location /api/health/ {
            proxy_pass http://application_service/api/health/;
        }

        location /api/auth/ {
            proxy_pass http://user_service/api/auth/;
        }

        location /api/users/ {
            proxy_pass http://user_service/api/users/;
        }

        location /api/projects/ {
            proxy_pass http://project_service/api/projects/;
        }

        location /api/applications/ {
            proxy_pass http://application_service/api/applications/;
        }

        location /api/assignments/ {
            proxy_pass http://application_service/api/assignments/;
        }

        location /api/work/ {
            proxy_pass http://work_review_service/api/work/;
        }

        location /api/reviews/ {
            proxy_pass http://work_review_service/api/reviews/;
        }

        location /api/payments/ {
            proxy_pass http://payment_notification_service/api/payments/;
        }

        location /api/notifications/ {
            proxy_pass http://payment_notification_service/api/notifications/;
        }

        # Anything else (including routes without the trailing slash).
        location / {
            default_type application/json;
            return 404 '{"error":"The requested resource was not found.","code":"NOT_FOUND","details":{}}';
        }
    }
}
